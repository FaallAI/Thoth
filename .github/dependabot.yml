# SCA version updates (operator, 2026-11-25). Security updates are on in the repository
# settings; this adds one grouped pull request per ecosystem and week.
version: 2
updates:
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The daily yt-dlp update workflow bumps it, with its own checks.
      - dependency-name: yt-dlp
  - package-ecosystem: bun
    directories: [/dashboard, /renderer]
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/e2e, /packages/remotion-composition]
    schedule:
      interval: weekly
    groups:
      javascript-tools:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
