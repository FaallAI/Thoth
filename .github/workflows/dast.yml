name: DAST

# DAST (operator, 2026-11-25): a weekly OWASP ZAP baseline scan of the master images,
# started on the runner with a throwaway environment and no live provider. The baseline only
# spiders and scans passively; it never attacks. Its report goes to the job summary.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
  COMPOSE_FILE_ARGS: --env-file stage1.dast.env -f compose.stage1.local.yml -f compose.stage1.web.yml

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        # The thoth image carries Camoufox, the browsers and the speech models.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Write a throwaway environment
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/thoth-dast"
          mkdir -p "${root}/postgres" "${root}/minio"
          umask 077
          {
            echo "COMPOSE_PROJECT_NAME=thoth-dast"
            echo "THOTH_IMAGE=ghcr.io/faallai/thoth:master"
            echo "THOTH_WEB_IMAGE=ghcr.io/faallai/thoth-web:master"
            echo "THOTH_STAGE1_DATA_ROOT=${root}"
            echo "THOTH_CONTROL_PLANE_API_KEY=$(openssl rand -hex 24)"
            echo "THOTH_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "THOTH_EDITOR_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "THOTH_EDITOR_PREVIEW_SIGNING_KEY=$(openssl rand -hex 24)"
            echo "THOTH_MEDIA_S3_ACCESS_KEY=thoth-dast-$(openssl rand -hex 6)"
            echo "THOTH_MEDIA_S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "THOTH_AUTH_SECRET=$(openssl rand -hex 32)"
          } > stage1.dast.env

      - name: Start the site
        run: |
          set -euo pipefail
          docker compose ${COMPOSE_FILE_ARGS} up -d --wait postgresql editor-postgresql temporal minio
          docker compose ${COMPOSE_FILE_ARGS} run --rm --no-deps api thoth-control editor migrate | tail -1
          docker compose ${COMPOSE_FILE_ARGS} up -d --wait api web

      - name: Run the ZAP baseline
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/zap"
          chmod 777 "${RUNNER_TEMP}/zap"
          status=0
          docker run --rm --network host -v "${RUNNER_TEMP}/zap:/zap/wrk:rw" "${ZAP_IMAGE}" zap-baseline.py -t http://127.0.0.1:8088 -I -w report.md -r report.html || status=$?
          cat "${RUNNER_TEMP}/zap/report.md" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Dump service logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILE_ARGS} logs --no-color --tail 120

      - name: Stop the site
        if: always()
        run: docker compose ${COMPOSE_FILE_ARGS} down --remove-orphans --volumes
