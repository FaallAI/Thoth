name: Container image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  # The yt-dlp update workflow dispatches a build after it merges a bump.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/faallai/thoth
  RENDERER_REGISTRY_IMAGE: ghcr.io/faallai/thoth-remotion-renderer
  WEB_REGISTRY_IMAGE: ghcr.io/faallai/thoth-web

jobs:
  quality:
    name: Offline quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_PASSWORD: thoth
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      THOTH_FFMPEG: /usr/bin/ffmpeg
      THOTH_FFPROBE: /usr/bin/ffprobe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          test -x "$THOTH_FFMPEG"
          test -x "$THOTH_FFPROBE"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked Python dependencies
        run: uv sync --project python --frozen --all-groups --extra acquisition

      # The card crop tests check their selectors against recorded pages in Chromium (spec 5c-2);
      # THOTH_REQUIRE_BROWSER_TESTS below turns a missing browser into a failure, not a skip.
      - name: Install Chromium for the browser-backed tests
        working-directory: python
        run: uv run playwright install --with-deps chromium

      # Run from python/ so pytest reads python/pyproject.toml (asyncio_mode, markers);
      # from the repository root it finds no config and unmarked async tests fail.
      - name: Fetch speech test models
        working-directory: python
        run: uv run python ../docker/fetch_speech_models.py --whisper tiny --out "$RUNNER_TEMP/models"

      - name: Start a throwaway MinIO for the media store contract
        run: |
          set -euo pipefail
          docker run -d --name thoth-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=thoth-test -e MINIO_ROOT_PASSWORD=thoth-test-secret \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

      - name: Run Python non-live tests
        working-directory: python
        env:
          THOTH_TEST_WHISPER_MODEL_DIR: ${{ runner.temp }}/models/whisper-tiny
          THOTH_TEST_DIARIZATION_MODEL_DIR: ${{ runner.temp }}/models/diarization
          THOTH_TEST_EMBEDDING_MODEL_DIR: ${{ runner.temp }}/models/embedding
          THOTH_TEST_EDITOR_DATABASE_URL: postgresql://postgres:thoth@127.0.0.1:5432/postgres
          THOTH_REQUIRE_POSTGRES_TESTS: "1"
          THOTH_TEST_MEDIA_S3_ENDPOINT: 127.0.0.1:9000
          THOTH_TEST_MEDIA_S3_ACCESS_KEY: thoth-test
          THOTH_TEST_MEDIA_S3_SECRET_KEY: thoth-test-secret
          THOTH_REQUIRE_MINIO_TESTS: "1"
          THOTH_REQUIRE_BROWSER_TESTS: "1"
        run: uv run pytest -m "not live" -q

      - name: Run Ruff checks
        run: |
          uv run --project python ruff check python/src python/tests
          uv run --project python ruff format --check python/src python/tests

      # Rendering is opt-in, so both shapes are gated: the base stack has to parse
      # with no renderer input at all, and the overlay has to parse with the pair.
      - name: Validate local Stage 1 Compose
        run: |
          set -euo pipefail
          THOTH_RENDERER_IMAGE= THOTH_RENDERER_INTERNAL_CREDENTIAL= docker compose --env-file .env.stage1.local.example -f compose.stage1.local.yml config --quiet
          docker compose --env-file .env.stage1.local.example -f compose.stage1.local.yml -f compose.stage1.renderer.yml config --quiet
          docker compose --env-file .env.stage1.local.example -f compose.stage1.local.yml -f compose.stage1.web.yml config --quiet

      - name: Install locked Scout dependencies
        run: bun --cwd=scout install --frozen-lockfile

      - name: Run Scout acquisition regressions
        run: bun --cwd=scout run test:acquisition

      - name: Run Scout runtime tests
        run: bun --cwd=scout run test:runtime

  validate-image:
    name: Validate image build
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CANDIDATE_IMAGE: thoth-stage1:pr-${{ github.sha }}
      RENDERER_CANDIDATE_IMAGE: thoth-remotion-renderer:pr-${{ github.sha }}
      WEB_CANDIDATE_IMAGE: thoth-web:pr-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        # The image carries Camoufox's browser; the hosted runner's preinstalled SDKs
        # otherwise leave too little disk to build or pull it.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=thoth-container
          cache-to: type=gha,mode=max,scope=thoth-container

      - name: Build the renderer without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.renderer
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.RENDERER_CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=thoth-renderer
          cache-to: type=gha,mode=max,scope=thoth-renderer

      - name: Build the web image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.WEB_CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=thoth-web
          cache-to: type=gha,mode=max,scope=thoth-web

      # Chromium answers on loopback even when no sibling container can reach it, so a
      # build that succeeds proves nothing about the transport the worker depends on.
      - name: Verify private CDP transport
        run: bash docker/test-cdp-offline.sh "${CANDIDATE_IMAGE}"

      # The stealthy sessions launch through patchright's own Chromium revision while
      # `scrapling install` installs playwright's; the 2026-10-23 refresh shipped the
      # driver without its browser and every card visit failed as headless_blocked.
      - name: Verify the stealthy browser can launch
        run: bash docker/test-browser-offline.sh "${CANDIDATE_IMAGE}"

      # A render crosses both images, so neither candidate is validated until a
      # synthetic document has actually become an MP4 through the pair.
      - name: Verify the isolated render stack
        run: bash docker/test-renderer-offline.sh "${CANDIDATE_IMAGE}" "${RENDERER_CANDIDATE_IMAGE}" "${WEB_CANDIDATE_IMAGE}"

  publish-image:
    name: Publish image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      renderer_digest: ${{ steps.renderer-build.outputs.digest }}
      web_digest: ${{ steps.web-build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        # The image carries Camoufox's browser; the hosted runner's preinstalled SDKs
        # otherwise leave too little disk to build or pull it.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Thoth Stage 1 compatibility runtime
            org.opencontainers.image.description=Python TikTok acquisition with temporary Scout fallback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=thoth-container
          cache-to: type=gha,mode=max,scope=thoth-container
          provenance: mode=max
          sbom: true

      - name: Generate renderer image metadata
        id: renderer-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.RENDERER_REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Thoth isolated Remotion renderer
            org.opencontainers.image.description=Browser and encoder for one saved revision
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish renderer image
        id: renderer-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.renderer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.renderer-meta.outputs.tags }}
          labels: ${{ steps.renderer-meta.outputs.labels }}
          cache-from: type=gha,scope=thoth-renderer
          cache-to: type=gha,mode=max,scope=thoth-renderer
          provenance: mode=max
          sbom: true

      - name: Generate web image metadata
        id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Thoth dashboard web
            org.opencontainers.image.description=The dashboard SPA behind Caddy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish web image
        id: web-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=thoth-web
          cache-to: type=gha,mode=max,scope=thoth-web
          provenance: mode=max
          sbom: true

      - name: Record immutable release identity
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RENDERER_IMAGE_TAGS: ${{ steps.renderer-meta.outputs.tags }}
          RENDERER_IMAGE_DIGEST: ${{ steps.renderer-build.outputs.digest }}
          WEB_IMAGE_TAGS: ${{ steps.web-meta.outputs.tags }}
          WEB_IMAGE_DIGEST: ${{ steps.web-build.outputs.digest }}
        run: |
          {
            echo "## Published container image"
            echo
            echo "- Repository: ${REGISTRY_IMAGE}"
            echo "- Git revision: ${GITHUB_SHA}"
            echo "- Platform: linux/amd64"
            echo "- Digest: ${IMAGE_DIGEST}"
            echo
            echo "### Tags"
            echo '```text'
            printf '%s\n' "${IMAGE_TAGS}"
            echo '```'
            echo
            echo "## Published renderer image"
            echo
            echo "- Repository: ${RENDERER_REGISTRY_IMAGE}"
            echo "- Git revision: ${GITHUB_SHA}"
            echo "- Platform: linux/amd64"
            echo "- Digest: ${RENDERER_IMAGE_DIGEST}"
            echo
            echo "### Tags"
            echo '```text'
            printf '%s\n' "${RENDERER_IMAGE_TAGS}"
            echo '```'
            echo
            echo "## Published web image"
            echo
            echo "- Repository: ${WEB_REGISTRY_IMAGE}"
            echo "- Git revision: ${GITHUB_SHA}"
            echo "- Platform: linux/amd64"
            echo "- Digest: ${WEB_IMAGE_DIGEST}"
            echo
            echo "### Tags"
            echo '```text'
            printf '%s\n' "${WEB_IMAGE_TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  stack-smoke:
    name: Non-live stack smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE_ARGS: --env-file stage1.ci.env -f compose.stage1.local.yml
      THOTH_IMAGE_REF: ghcr.io/faallai/thoth@${{ needs.publish-image.outputs.digest }}
      THOTH_RENDERER_IMAGE_REF: ghcr.io/faallai/thoth-remotion-renderer@${{ needs.publish-image.outputs.renderer_digest }}
      THOTH_WEB_IMAGE_REF: ghcr.io/faallai/thoth-web@${{ needs.publish-image.outputs.web_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        # The image carries Camoufox's browser; the hosted runner's preinstalled SDKs
        # otherwise leave too little disk to build or pull it.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare a data root outside the checkout
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/thoth-stage1"
          mkdir -p "${root}"/postgres "${root}"/artifacts "${root}"/browser-profile "${root}"/minio
          mkdir -p "${root}"/observations "${root}"/reports "${root}"/account-profiles
          sudo chown -R 10001:10001 "${root}/artifacts" "${root}/browser-profile"
          sudo chown -R 10001:10001 "${root}/account-profiles"
          sudo chmod 750 "${root}/artifacts" "${root}/browser-profile"
          sudo chmod 700 "${root}/account-profiles"

      - name: Write a throwaway local environment
        run: |
          set -euo pipefail
          umask 077
          {
            echo "COMPOSE_PROJECT_NAME=thoth-stage1-ci"
            echo "THOTH_IMAGE=${THOTH_IMAGE_REF}"
            echo "THOTH_STAGE1_DATA_ROOT=${RUNNER_TEMP}/thoth-stage1"
            echo "THOTH_STAGE1_ACTIVITY_MODE=python_tiktok_with_legacy_fallback"
            echo "THOTH_CONTROL_PLANE_API_KEY=$(openssl rand -hex 24)"
            echo "THOTH_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "THOTH_EDITOR_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "THOTH_EDITOR_PREVIEW_SIGNING_KEY=$(openssl rand -hex 24)"
            echo "THOTH_MEDIA_S3_ACCESS_KEY=thoth-ci-$(openssl rand -hex 6)"
            echo "THOTH_MEDIA_S3_SECRET_KEY=$(openssl rand -hex 24)"
          } > stage1.ci.env

      - name: Validate the operator inputs
        run: |
          uv run --project python thoth-control operations stage1-local-preflight             --env-file stage1.ci.env

      - name: Start the non-live services
        run: docker compose ${COMPOSE_FILE_ARGS} up -d --wait postgresql editor-postgresql temporal temporal-ui api

      - name: Apply Creator Studio editor migration
        run: |
          set -euo pipefail
          test "$(docker compose ${COMPOSE_FILE_ARGS} run --rm --no-deps api thoth-control editor migrate | tail -1)" = "$(ls python/migrations/editor/0*.sql | wc -l | tr -d ' ')"
          test "$(docker compose ${COMPOSE_FILE_ARGS} run --rm --no-deps api thoth-control editor migrate | tail -1)" = "0"

      - name: Verify identity, storage, and loopback isolation
        run: |
          set -euo pipefail
          test "$(docker compose ${COMPOSE_FILE_ARGS} exec -T api id -u)" = "10001"
          test "$(docker compose ${COMPOSE_FILE_ARGS} exec -T api id -g)" = "10001"
          docker compose ${COMPOSE_FILE_ARGS} exec -T api test -w /var/lib/thoth/artifacts
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          ports="$(docker compose ${COMPOSE_FILE_ARGS} ps --format '{{.Service}} {{.Ports}}')"
          echo "${ports}"
          echo "${ports}" | grep -q '^api .*127\.0\.0\.1:8000->8000'
          echo "${ports}" | grep -q '^temporal-ui .*127\.0\.0\.1:8080->8080'
          ! echo "${ports}" | grep -E '^(postgresql|temporal) ' | grep -q -- '->'

      - name: Verify the namespace survives a restart
        run: |
          set -euo pipefail
          describe="exec -T temporal temporal operator namespace describe"
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILE_ARGS} ${describe}             --namespace thoth-stage1 --address temporal:7233
          docker compose ${COMPOSE_FILE_ARGS} restart postgresql temporal
          docker compose ${COMPOSE_FILE_ARGS} up -d --wait postgresql temporal
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILE_ARGS} ${describe}             --namespace thoth-stage1 --address temporal:7233

      - name: Verify private CDP transport on the published digest
        run: bash docker/test-cdp-offline.sh "${THOTH_IMAGE_REF}"

      - name: Verify the isolated render stack on the published digests
        run: bash docker/test-renderer-offline.sh "${THOTH_IMAGE_REF}" "${THOTH_RENDERER_IMAGE_REF}" "${THOTH_WEB_IMAGE_REF}"

      - name: Dump service logs on failure
        if: failure()
        run: |
          test -f stage1.ci.env || exit 0
          docker compose ${COMPOSE_FILE_ARGS} logs --no-color --tail 120

      - name: Stop the stack
        if: always()
        run: |
          test -f stage1.ci.env || exit 0
          docker compose ${COMPOSE_FILE_ARGS} down --remove-orphans

  template-release-parity:
    name: Template release parity
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      F1_IMAGE: thoth-renderer-f1:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The reference environment is built here rather than pulled: it is a test
      # image, it is never published, and the comparison is only meaningful when
      # the browser and fonts that draw both surfaces are this image's own.
      - name: Build the F1 reference environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.renderer-f1
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.F1_IMAGE }}
          cache-from: type=gha,scope=thoth-renderer-f1
          cache-to: type=gha,mode=max,scope=thoth-renderer-f1

      # The candidate lands in a throwaway root outside the checkout, and it is
      # neither promoted nor uploaded: approving a golden set is the operator's
      # gate, so this step stays non-pass until the capsule carries one.
      - name: Verify the released templates with no network
        run: |
          set -euo pipefail
          image_id="$(docker image inspect "${F1_IMAGE}" --format '{{.Id}}')"
          root="$(mktemp -d)"
          trap 'sudo rm -rf "${root}"' EXIT
          sudo chown 10001:10001 "${root}"
          # story_mode-v1 (Story mode's motion and emphasis) approved by the operator on 2026-10-28.
          for release in vertical_text_story-v1 story_mode-v1; do
            docker run --rm --network none \
              -e THOTH_CONTROL_PLANE_ARTIFACT_ROOT=/var/lib/thoth/artifacts \
              -e THOTH_F1_IMAGE_ID="${image_id}" \
              -v "${root}":/var/lib/thoth/artifacts \
              "${F1_IMAGE}" \
              bun run scripts/verify-template-release.ts "${release}"
          done
