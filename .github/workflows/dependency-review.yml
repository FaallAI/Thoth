name: Dependency review

# SCA on pull requests (operator, 2026-11-25): a new or upgraded dependency with a known
# high or critical vulnerability fails this check. Separate from the container CI.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
