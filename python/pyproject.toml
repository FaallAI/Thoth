[project]
name = "thoth-control-plane"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agno>=3.2.1,<4",
    "fastapi>=0.165.0,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.16.3,<3",
    "psycopg[binary]>=3.3.9,<4",
    "temporalio>=1.36.1,<2",
    "typer>=0.29.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "sqlalchemy>=2.1.9,<3",
    "alembic>=1.13,<2",
    "cryptography>=44,<51",
    "minio>=7.2.20,<8",
    "authlib>=1.9.10,<2",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
# yt-dlp is pinned in both extras; the yt-dlp update workflow bumps both.
# sherpa-onnx-core is listed explicitly: uv locked sherpa-onnx 1.13.8 without it (its wheels
# disagree on the dependency), so a frozen sync could not import sherpa_onnx.
acquisition = ["scrapling[fetchers]>=0.5.1,<0.6", "yt-dlp==2026.11.23", "opencv-python-headless>=5.1.0.95,<6", "rapidocr>=3.9,<4", "onnxruntime>=1.32.0,<2", "openai>=3.57.0,<4", "faster-whisper>=1.2,<2", "sherpa-onnx>=1.13,<2", "sherpa-onnx-core>=2.0.3,<3", "av>=18.1.1", "pillow>=10", "camoufox==0.5.9"]
# Legacy Scout shells out to both executables; the compatibility image must ship them.

[project.scripts]
thoth-control = "thoth_control_plane.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.5.0,<2",
  "respx>=0.22,<1",
    "ruff>=0.17.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: requires explicit public provider fixture and installed browser dependencies",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth_control_plane"]
