name: thoth-stage1-local

services:
  postgresql:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${THOTH_POSTGRES_PASSWORD:?set THOTH_POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [stage1-private]

  editor-postgresql:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: thoth_editor
      POSTGRES_USER: thoth_editor
      POSTGRES_PASSWORD: ${THOTH_EDITOR_POSTGRES_PASSWORD:?set THOTH_EDITOR_POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/editor-postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoth_editor -d thoth_editor"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [stage1-private]

  temporal:
    image: temporalio/auto-setup:1.29.1@sha256:5b3502a3b685f9eff1b925af90c57c9e3dbeccbef367cc28a2a9712c63379312
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${THOTH_POSTGRES_PASSWORD:?set THOTH_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      DEFAULT_NAMESPACE: thoth-stage1
      DEFAULT_NAMESPACE_RETENTION: 30d
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [stage1-private]

  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks: [stage1-private]

  legacy-cdp:
    image: ${THOTH_IMAGE:?set digest-qualified THOTH_IMAGE}
    user: "10001:10001"
    command: ["/opt/thoth/bin/start-legacy-cdp"]
    security_opt:
      - seccomp:unconfined
    volumes:
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/browser-profile
        target: /var/lib/thoth/browser-profile
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/thoth/python/.venv/bin/python -c "import json, urllib.parse, urllib.request;
          version = urllib.request.urlopen('http://127.0.0.1:18800/json/version', timeout=2);
          assert 200 <= version.status < 300;
          targets = json.load(urllib.request.urlopen('http://127.0.0.1:18800/json', timeout=2));
          pages = [urllib.parse.urlsplit(target.get('url', '')) for target in targets if target.get('type') == 'page'];
          blocked = ('login', 'signup', 'captcha', 'challenge', 'verify', 'security-check');
          assert any(page.scheme == 'https' and page.hostname in ('www.tiktok.com', 'tiktok.com', 'm.tiktok.com') and not any(marker in (page.path + '?' + page.query).lower() for marker in blocked) for page in pages)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [stage1-private]

  minio:
    # The official minio/minio image is no longer published; pgsty/minio rebuilds the same
    # server (operator, 2026-10-17). Workflow media lives here (spec 2026-10-17).
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${THOTH_MEDIA_S3_ACCESS_KEY:?set THOTH_MEDIA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${THOTH_MEDIA_S3_SECRET_KEY:?set THOTH_MEDIA_S3_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/minio
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [stage1-private]

  api:
    image: ${THOTH_IMAGE:?set digest-qualified THOTH_IMAGE}
    user: "10001:10001"
    command:
      - /opt/thoth/python/.venv/bin/uvicorn
      - thoth_control_plane.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      temporal:
        condition: service_healthy
      editor-postgresql:
        condition: service_healthy
    environment:
      THOTH_CONTROL_PLANE_API_KEY: ${THOTH_CONTROL_PLANE_API_KEY:?set THOTH_CONTROL_PLANE_API_KEY}
      THOTH_EDITOR_PREVIEW_SIGNING_KEY: ${THOTH_EDITOR_PREVIEW_SIGNING_KEY:?set THOTH_EDITOR_PREVIEW_SIGNING_KEY}
      THOTH_EDITOR_DATABASE_URL: "postgresql://thoth_editor:${THOTH_EDITOR_POSTGRES_PASSWORD:?set THOTH_EDITOR_POSTGRES_PASSWORD}@editor-postgresql:5432/thoth_editor"
      # Optional Fernet key; empty keeps source accounts off and acquisition anonymous.
      THOTH_ACCOUNT_VAULT_KEY: "${THOTH_ACCOUNT_VAULT_KEY:-}"
      THOTH_TEMPORAL_TARGET: temporal:7233
      THOTH_TEMPORAL_NAMESPACE: thoth-stage1
      # Container-local scratch: no service shares the artifact volume any more
      # (spec 2026-10-17, render storage); every persistent object is in the media store.
      THOTH_CONTROL_PLANE_ARTIFACT_ROOT: /tmp/thoth-artifacts
      THOTH_MEDIA_S3_ENDPOINT: minio:9000
      THOTH_MEDIA_S3_BUCKET: thoth-media
      THOTH_MEDIA_S3_ACCESS_KEY: ${THOTH_MEDIA_S3_ACCESS_KEY:?set THOTH_MEDIA_S3_ACCESS_KEY}
      THOTH_MEDIA_S3_SECRET_KEY: ${THOTH_MEDIA_S3_SECRET_KEY:?set THOTH_MEDIA_S3_SECRET_KEY}
      THOTH_SOURCE_INVESTIGATION_ACTIVITY_MODE: python_tiktok_with_legacy_fallback
      THOTH_PROMPT_PROVIDER_CATALOG: ${THOTH_PROMPT_PROVIDER_CATALOG:-[]}
      # Stage 5a content assembly; the worker refuses to start with it on and no ffmpeg.
      THOTH_CONTENT_ASSEMBLY_ENABLED: ${THOTH_CONTENT_ASSEMBLY_ENABLED:-false}
      THOTH_FOOTAGE_ENABLED: ${THOTH_FOOTAGE_ENABLED:-false}
    volumes:
      # Sealed per-account browser profiles: the worker writes them, the api deletes them.
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/account-profiles
        target: /var/lib/thoth/account-profiles
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/thoth/python/.venv/bin/python -c "import urllib.request;
          assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200;
          assert urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [stage1-private]

  worker:
    image: ${THOTH_IMAGE:?set digest-qualified THOTH_IMAGE}
    user: "10001:10001"
    depends_on:
      temporal:
        condition: service_healthy
      legacy-cdp:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      THOTH_CONTROL_PLANE_API_KEY: ${THOTH_CONTROL_PLANE_API_KEY:?set THOTH_CONTROL_PLANE_API_KEY}
      THOTH_TEMPORAL_TARGET: temporal:7233
      THOTH_TEMPORAL_NAMESPACE: thoth-stage1
      # Container-local scratch: no service shares the artifact volume any more
      # (spec 2026-10-17, render storage); every persistent object is in the media store.
      THOTH_CONTROL_PLANE_ARTIFACT_ROOT: /tmp/thoth-artifacts
      THOTH_MEDIA_S3_ENDPOINT: minio:9000
      THOTH_MEDIA_S3_BUCKET: thoth-media
      THOTH_MEDIA_S3_ACCESS_KEY: ${THOTH_MEDIA_S3_ACCESS_KEY:?set THOTH_MEDIA_S3_ACCESS_KEY}
      THOTH_MEDIA_S3_SECRET_KEY: ${THOTH_MEDIA_S3_SECRET_KEY:?set THOTH_MEDIA_S3_SECRET_KEY}
      THOTH_FFMPEG: /usr/bin/ffmpeg
      THOTH_FFPROBE: /usr/bin/ffprobe
      THOTH_CDP: http://legacy-cdp:18800
      THOTH_SOURCE_INVESTIGATION_ACTIVITY_MODE: ${THOTH_STAGE1_ACTIVITY_MODE:-python_tiktok_with_legacy_fallback}
      THOTH_EDITOR_DATABASE_URL: "postgresql://thoth_editor:${THOTH_EDITOR_POSTGRES_PASSWORD:?set THOTH_EDITOR_POSTGRES_PASSWORD}@editor-postgresql:5432/thoth_editor"
      # Optional Fernet key; empty keeps source accounts off and acquisition anonymous.
      THOTH_ACCOUNT_VAULT_KEY: "${THOTH_ACCOUNT_VAULT_KEY:-}"
      THOTH_PROMPT_PROVIDER_CATALOG: ${THOTH_PROMPT_PROVIDER_CATALOG:-[]}
      # Stage 5a content assembly; the worker refuses to start with it on and no ffmpeg.
      THOTH_CONTENT_ASSEMBLY_ENABLED: ${THOTH_CONTENT_ASSEMBLY_ENABLED:-false}
      THOTH_FOOTAGE_ENABLED: ${THOTH_FOOTAGE_ENABLED:-false}
      THOTH_PROMPT_PROVIDER_SECRETS: ${THOTH_PROMPT_PROVIDER_SECRETS:-{}}
    volumes:
      # Sealed per-account browser profiles: the worker writes them, the api deletes them.
      - type: bind
        source: ${THOTH_STAGE1_DATA_ROOT:?set THOTH_STAGE1_DATA_ROOT}/account-profiles
        target: /var/lib/thoth/account-profiles
    restart: unless-stopped
    networks: [stage1-private]

networks:
  stage1-private:
    driver: bridge
